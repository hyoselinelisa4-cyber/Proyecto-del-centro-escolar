<!DOCTYPE html>
<!-- Le decimos al navegador que este documento usa HTML5 -->
<html lang="es">
<head>
  <meta charset="UTF-8"> <!-- Para que se muestren bien las tildes y la ñ -->
  <title>Login</title> <!-- Texto que aparece en la pestaña del navegador -->

  <style>
    /* ---------- ESTILOS GENERALES DE LA PÁGINA ---------- */
    body {
      display: flex;             /* Convierte el body en un contenedor flexible */
      justify-content: center;   /* Centra el contenido horizontalmente */
      align-items: center;       /* Centra el contenido verticalmente */
      height: 100vh;             /* La altura ocupa el 100% de la pantalla */
      margin: 0;                 /* Quitamos el margen que trae el navegador por defecto */
      font-family: Arial, sans-serif; /* Tipo de letra */
      background-color: #f2f2f2; /* Color de fondo gris claro */
    }

    /* ---------- LA CAJA BLANCA DEL FORMULARIO ---------- */
    .login-box {
      background: #fff;          /* Fondo blanco */
      padding: 30px;             /* Espacio interior entre el borde y el contenido */
      border-radius: 8px;        /* Bordes redondeados */
      box-shadow: 0 0 10px rgba(0,0,0,0.1); /* Sombra suave alrededor de la caja */
      width: 250px;              /* Ancho fijo de la caja */
    }

    .login-box h2 {
      text-align: center;        /* Centra el título "Iniciar sesión" */
      margin-bottom: 20px;       /* Espacio debajo del título */
    }

    .login-box label {
      display: block;            /* Cada etiqueta ocupa su propia línea */
      margin-bottom: 5px;        /* Pequeño espacio antes del campo de texto */
    }

    .login-box input {
      width: 100%;               /* El campo ocupa todo el ancho de la caja */
      padding: 8px;               /* Espacio interior para que no quede pegado el texto */
      margin-bottom: 15px;       /* Espacio entre un campo y el siguiente */
      box-sizing: border-box;    /* El padding no aumenta el ancho total del campo */
    }

    .login-box button {
      width: 100%;
      padding: 10px;
      background-color: #333;    /* Fondo oscuro del botón */
      color: #fff;                /* Texto blanco */
      border: none;               /* Sin borde */
      border-radius: 4px;        /* Bordes ligeramente redondeados */
      cursor: pointer;           /* El cursor cambia a "mano" al pasar por encima */
    }

    .login-box button:hover {
      background-color: #555;    /* Cambia el color cuando el ratón pasa por encima */
    }
  </style>
</head>

<body>

  <!-- Caja principal que contiene todo el formulario -->
  <div class="login-box">

    <h2>Iniciar sesión</h2>

    <!-- El formulario agrupa los campos de entrada y el botón -->
    <form>

      <!-- "for" conecta la etiqueta con el input que tiene el mismo "id" -->
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" name="usuario">

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password">
      <!-- type="password" hace que lo que se escribe se vea oculto con puntos -->

      <button type="submit">Entrar</button>
      <!-- type="submit" hace que el botón envíe el formulario -->

    </form>
  </div>

</body>
</html>
